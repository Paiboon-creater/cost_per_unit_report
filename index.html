<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>JAGUAR // COST MATRIX</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* ==========================================
       THEME: STOCK MARKET BOARD (DARK MODE)
    ========================================== */
    :root {
      --bg-black: #050505;
      --panel-bg: #111111;
      --border-dark: #333333;
      --text-main: #e0e0e0;
      --text-muted: #888888;
      --stock-green: #00ff00;
      --stock-red: #ff3333;
      --stock-yellow: #ffcc00;
      --stock-blue: #00ccff;
      --highlight: #1a1a1a;
    }

    body {
      font-family: 'Courier New', Courier, monospace, 'Sarabun', sans-serif;
      background-color: var(--bg-black);
      color: var(--text-main);
      margin: 0; padding: 15px;
      font-size: 13px;
    }

    .container { max-width: 1400px; margin: 0 auto; }

    /* HOME NAV BUTTON */
    .nav-btn {
      background: rgba(0, 204, 255, 0.1); border: 1px solid var(--stock-blue);
      color: var(--stock-blue); padding: 8px 16px; border-radius: 4px;
      text-decoration: none; font-weight: bold; font-size: 14px;
      display: inline-flex; align-items: center; gap: 8px; transition: all 0.3s;
    }
    .nav-btn:hover { 
      background: var(--stock-blue); color: var(--bg-black); 
      box-shadow: 0 0 10px rgba(0, 204, 255, 0.5); 
    }

    /* HEADER */
    .app-header {
      display: flex; justify-content: space-between; align-items: flex-end;
      border-bottom: 2px solid var(--border-dark); padding-bottom: 10px; margin-bottom: 15px;
    }
    .app-title {
      font-size: 24px; font-weight: bold; color: var(--stock-yellow); margin: 0;
      letter-spacing: 2px; text-transform: uppercase;
    }
    
    /* TOOLBAR & FILTERS */
    .toolbar {
      background: var(--panel-bg); border: 1px solid var(--border-dark);
      padding: 15px; border-radius: 4px; margin-bottom: 20px;
    }
    .filter-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 15px;
    }
    .filter-group { display: flex; flex-direction: column; gap: 5px; }
    .filter-group label { color: var(--text-muted); font-size: 11px; text-transform: uppercase; }
    .filter-group input {
      background: #000; border: 1px solid #444; color: var(--stock-yellow);
      padding: 8px; font-family: inherit; font-size: 14px; border-radius: 2px;
    }
    .filter-group input:focus { border-color: var(--stock-blue); outline: none; }
    .filter-group input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1) sepia(1) saturate(5) hue-rotate(175deg); cursor: pointer; }

    .action-buttons {
      display: flex; gap: 10px; justify-content: flex-start;
      padding-top: 15px; border-top: 1px dashed var(--border-dark); flex-wrap: wrap;
    }
    .btn {
      padding: 8px 16px; border-radius: 2px; font-family: inherit; font-weight: bold;
      cursor: pointer; display: inline-flex; align-items: center; gap: 8px; text-transform: uppercase;
      border: 1px solid; transition: all 0.2s; background: #000;
    }
    .btn-calc { color: var(--stock-yellow); border-color: var(--stock-yellow); }
    .btn-calc:hover { background: var(--stock-yellow); color: #000; }
    .btn-export { color: var(--stock-green); border-color: var(--stock-green); }
    .btn-export:hover { background: var(--stock-green); color: #000; }
    .btn-print { color: var(--text-main); border-color: var(--text-main); }
    .btn-print:hover { background: var(--text-main); color: #000; }

    /* MATRIX TABLE STYLE */
    .matrix-container { margin-bottom: 20px; border: 1px solid var(--border-dark); background: var(--panel-bg); border-radius: 4px; overflow: hidden; }
    .matrix-title {
      background: linear-gradient(90deg, #1a1a1a, #000); color: var(--stock-yellow);
      padding: 12px 15px; margin: 0; font-size: 16px; font-weight: bold;
      border-bottom: 2px solid var(--stock-yellow);
      cursor: pointer; display: flex; justify-content: space-between; align-items: center;
      transition: background 0.3s;
    }
    .matrix-title:hover { background: #222; }
    
    .table-wrapper { overflow-x: auto; transition: max-height 0.3s ease-out; }
    .matrix-container.collapsed .table-wrapper { display: none; }
    .matrix-container.collapsed .matrix-title { border-bottom: none; }

    table { width: 100%; border-collapse: collapse; text-align: right; white-space: nowrap; }
    th, td { padding: 10px; border-bottom: 1px solid #1a1a1a; border-right: 1px dotted #333; }
    th { color: var(--text-muted); font-weight: normal; background: #000; text-align: center; }
    td:last-child, th:last-child { border-right: none; }
    
    .sticky-col {
      position: sticky; left: 0; background: #050505; z-index: 2; text-align: left;
      font-weight: bold; color: var(--stock-blue); border-right: 2px solid var(--border-dark);
      min-width: 130px; 
      font-size: 12px;
    }
    
    .row-qty td { color: var(--text-main); }
    .row-hrs td { color: var(--text-muted); }
    .row-cost td { color: var(--stock-green); font-weight: bold; }
    
    .total-col { background: rgba(255, 204, 0, 0.05); font-weight: bold; }
    .val-zero { color: #444 !important; } 

    .loading-msg { text-align: center; padding: 30px; color: var(--stock-blue); font-size: 16px; letter-spacing: 2px; }

    /* ==========================================
       PRINT MEDIA QUERY 
    ========================================== */
    .print-header { display: none; }

    @media print {
      body { background-color: #ffffff; color: #000000; margin: 0; padding: 0; }
      .no-print { display: none !important; }
      
      .print-header {
        display: block; text-align: center; margin-bottom: 20px;
        border-bottom: 2px solid #000; padding-bottom: 10px;
      }
      .print-header h1 { font-size: 20px; margin: 0 0 5px 0; font-family: 'Sarabun', sans-serif; }
      .print-header p { margin: 0; font-size: 12px; color: #555; }

      .matrix-container { 
        border: 1px solid #000; margin-bottom: 20px; page-break-inside: avoid; 
        overflow: visible !important; 
      }
      .matrix-container.collapsed .table-wrapper { display: block !important; } 
      .table-wrapper { 
        overflow-x: visible !important; 
        overflow-y: visible !important;
      }
      
      .matrix-title { background: #f0f0f0; color: #000; border-bottom: 2px solid #000; padding: 8px; }
      table { border-collapse: collapse; width: 100% !important; }
      th, td { border: 1px solid #ccc; color: #000 !important; padding: 6px; font-size: 12px; }
      .sticky-col { position: static; background: #f9f9f9; border-right: 1px solid #000; min-width: auto; }
      .row-cost td { font-weight: bold; }
      
      ::-webkit-scrollbar { display: none; } 
    }
  </style>
</head>
<body>

<div class="container">
  
  <div style="display: flex; justify-content: flex-end; margin-bottom: 10px;" class="no-print">
    <a href="https://paiboon-creater.github.io/Data_Information_Jaguar_productions/" class="nav-btn">
      <i class="fa-solid fa-house"></i> HOME APP
    </a>
  </div>

  <div class="app-header no-print">
    <div>
      <h1 class="app-title"><i class="fa-solid fa-layer-group"></i> COST MATRIX BOARD</h1>
      <div style="color: var(--text-muted); font-size: 12px; margin-top: 5px;">รายงานต้นทุนการผลิตแยกตามขั้นตอน (Pivot Format)</div>
    </div>
  </div>

  <!-- PRINT ONLY HEADER -->
  <div class="print-header">
    <h1>สรุปรายงานต้นทุนการผลิต ต่อหน่วยแยกตามขั้นตอนการผลิต โรงงาน BC</h1>
    <p>พิมพ์เมื่อ: <span id="printTimestamp"></span></p>
  </div>

  <!-- TOOLBAR -->
  <div class="toolbar no-print">
    <div class="filter-grid">
      <div class="filter-group">
        <label>ตั้งแต่วันที่ (DATE FROM)</label>
        <input type="date" id="date_from">
      </div>
      <div class="filter-group">
        <label>ถึงวันที่ (DATE TO)</label>
        <input type="date" id="date_to">
      </div>
      <div class="filter-group">
        <label>ค่าแรงพนักงาน (บาท/วัน)</label>
        <input type="number" id="base_wage" value="400">
      </div>
      <div class="filter-group">
        <label>ชั่วโมงงานปกติ (ชม./วัน)</label>
        <input type="number" id="base_hours" value="8">
      </div>
    </div>

    <div class="action-buttons">
      <button class="btn btn-calc" onclick="generateMatrix()"><i class="fa-solid fa-calculator"></i> ประมวลผลตาราง (CALCULATE)</button>
      <button class="btn btn-export" onclick="exportToExcel()"><i class="fa-solid fa-file-excel"></i> ส่งออก EXCEL</button>
      <button class="btn btn-print" onclick="window.print()"><i class="fa-solid fa-print"></i> พิมพ์รายงาน (PRINT)</button>
    </div>
  </div>

  <!-- CONTAINER สำหรับแสดงตารางแต่ละขั้นตอน -->
  <div id="reportContainer">
    <div class="loading-msg" style="color:var(--text-muted)">รอการประมวลผล... กรุณากด "ประมวลผลตาราง"</div>
  </div>

</div>

<script>
  // ==========================================
  // CONFIGURATION & SETUP
  // ==========================================
  const SUPABASE_URL = "https://siiiifesdjuunwmwozfb.supabase.co/rest/v1";
  const SUPABASE_KEY = "sb_publishable_ohToE8Z_Fzo87uBtzdPDIg_cqHCi3HT";
  const headers = {
    "apikey": SUPABASE_KEY,
    "Authorization": "Bearer " + SUPABASE_KEY,
    "Content-Type": "application/json"
  };

  let db = { targets: [], steps: [] };

  window.onload = async function() {
    const today = new Date();
    document.getElementById('date_from').valueAsDate = today;
    document.getElementById('date_to').valueAsDate = today;
    
    let now = new Date();
    document.getElementById('printTimestamp').innerText = `${now.toLocaleDateString('th-TH')} ${now.toLocaleTimeString('th-TH')}`;
    
    await initDatabase();
  };

  async function initDatabase() {
    try {
      const [targetsRes, stepsRes] = await Promise.all([
        fetch(`${SUPABASE_URL}/targets?select=id_target,id_step`, { headers }),
        fetch(`${SUPABASE_URL}/production_steps?select=id_step,step_name`, { headers })
      ]);

      db.targets = await targetsRes.json();
      db.steps = await stepsRes.json();

    } catch (error) {
      console.error("Error loading master data", error);
      document.getElementById('reportContainer').innerHTML = `<div class="loading-msg" style="color:red">โหลดข้อมูลผิดพลาด: ${error.message}</div>`;
    }
  }

  // ฟังก์ชันสลับการยุบ/ขยายตาราง
  function toggleTable(btn) {
    const container = btn.closest('.matrix-container');
    container.classList.toggle('collapsed');
    const icon = btn.querySelector('.toggle-icon');
    if (container.classList.contains('collapsed')) {
      icon.classList.remove('fa-chevron-up');
      icon.classList.add('fa-chevron-down');
    } else {
      icon.classList.remove('fa-chevron-down');
      icon.classList.add('fa-chevron-up');
    }
  }

  // ==========================================
  // CORE ENGINE
  // ==========================================
  async function generateMatrix() {
    const container = document.getElementById('reportContainer');
    const dateFrom = document.getElementById('date_from').value;
    const dateTo = document.getElementById('date_to').value;
    const wagePerDay = parseFloat(document.getElementById('base_wage').value) || 0;
    const hoursPerDay = parseFloat(document.getElementById('base_hours').value) || 1;
    const hourlyRate = wagePerDay / hoursPerDay;

    if (!dateFrom || !dateTo) {
      alert("กรุณาเลือกช่วงวันที่"); return;
    }
    if (new Date(dateFrom) > new Date(dateTo)) {
      alert("วันที่เริ่มต้น ต้องน้อยกว่าหรือเท่ากับวันที่สิ้นสุด"); return;
    }

    container.innerHTML = '<div class="loading-msg"><i class="fa-solid fa-spinner fa-spin"></i> FETCHING DATA STREAM...</div>';

    try {
      // 1. ดึงข้อมูล
      const res = await fetch(`${SUPABASE_URL}/daily_production?record_date=gte.${dateFrom}&record_date=lte.${dateTo}`, { headers });
      const logs = await res.json();

      // 2. สร้าง Array วันที่ เพื่อกางเป็นคอลัมน์
      let dateRange = [];
      let cur = new Date(dateFrom);
      let end = new Date(dateTo);
      while(cur <= end) {
        dateRange.push(cur.toISOString().split('T')[0]);
        cur.setDate(cur.getDate() + 1);
      }

      // 3. เตรียม Data Structure สำหรับจัดกลุ่มแยกขั้นตอน
      let agg = {}; 
      
      db.steps.forEach(s => {
        agg[s.id_step] = { totalQty: 0, totalHrs: 0, daily: {} };
        dateRange.forEach(d => { agg[s.id_step].daily[d] = { qty: 0, hrs: 0 }; });
      });

      // 4. หยอดข้อมูลลงตาราง
      logs.forEach(log => {
        const target = db.targets.find(t => String(t.id_target) === String(log.id_target));
        if (target && target.id_step && agg[target.id_step] && agg[target.id_step].daily[log.record_date]) {
          const qty = log.produced_amount || 0;
          const hrs = log.hour_work || 0;

          // หยอดของแต่ละขั้นตอน
          agg[target.id_step].daily[log.record_date].qty += qty;
          agg[target.id_step].daily[log.record_date].hrs += hrs;
          agg[target.id_step].totalQty += qty;
          agg[target.id_step].totalHrs += hrs;
        }
      });

      let finalHTML = '';
      let renderedCount = 0;

      // 5. ลูปวาดตารางแยกแต่ละขั้นตอน
      let theadSubHTML = `<tr><th class="sticky-col">รายการ / วันที่</th>`;
      dateRange.forEach(d => {
        let dObj = new Date(d);
        theadSubHTML += `<th>${dObj.getDate().toString().padStart(2,'0')}/${(dObj.getMonth()+1).toString().padStart(2,'0')}</th>`;
      });
      theadSubHTML += `<th class="total-col" style="color:var(--stock-yellow);">รวมทั้งหมด</th></tr>`;

      db.steps.sort((a,b) => (a.id_step||0) - (b.id_step||0)).forEach(step => {
        const stepId = step.id_step;
        const data = agg[stepId];

        // ซ่อนขั้นตอนที่ไม่มีการผลิต
        if (data.totalQty === 0 && data.totalHrs === 0) return; 

        const stepName = step.step_name || 'Unknown';

        // 1. แถวยอดผลิต
        let rowQty = `<tr class="row-qty"><td class="sticky-col"><i class="fa-solid fa-cube"></i> ยอดผลิต (ชิ้น)</td>`;
        dateRange.forEach(d => {
          let val = data.daily[d].qty;
          rowQty += `<td class="${val===0?'val-zero':''}">${val.toLocaleString()}</td>`;
        });
        rowQty += `<td class="total-col">${data.totalQty.toLocaleString()}</td></tr>`;

        // 2. แถวเวลาทำ
        let rowHrs = `<tr class="row-hrs"><td class="sticky-col"><i class="fa-solid fa-clock"></i> เวลาทำ (ชม.)</td>`;
        dateRange.forEach(d => {
          let val = data.daily[d].hrs;
          rowHrs += `<td class="${val===0?'val-zero':''}">${val.toFixed(2)}</td>`;
        });
        rowHrs += `<td class="total-col">${data.totalHrs.toFixed(2)}</td></tr>`;

        // 3. แถวต้นทุน/ชิ้น
        let rowCost = `<tr class="row-cost"><td class="sticky-col"><i class="fa-solid fa-baht-sign"></i> ต้นทุน/ชิ้น (บาท)</td>`;
        dateRange.forEach(d => {
          let cQty = data.daily[d].qty;
          let cHrs = data.daily[d].hrs;
          let costPerUnit = cQty > 0 ? ((cHrs * hourlyRate) / cQty) : 0;
          rowCost += `<td class="${costPerUnit===0?'val-zero':''}">${costPerUnit.toLocaleString('th-TH', {minimumFractionDigits: 2, maximumFractionDigits: 4})}</td>`;
        });
        
        let totalCostPerUnit = data.totalQty > 0 ? ((data.totalHrs * hourlyRate) / data.totalQty) : 0;
        rowCost += `<td class="total-col">${totalCostPerUnit.toLocaleString('th-TH', {minimumFractionDigits: 2, maximumFractionDigits: 4})}</td></tr>`;

        finalHTML += `
          <div class="matrix-container">
            <h3 class="matrix-title" onclick="toggleTable(this)">
              <span>>> ขั้นตอน: ${stepName}</span>
              <i class="fa-solid fa-chevron-up toggle-icon"></i>
            </h3>
            <div class="table-wrapper">
              <table>
                <thead>${theadSubHTML}</thead>
                <tbody>
                  ${rowQty}
                  ${rowHrs}
                  ${rowCost}
                </tbody>
              </table>
            </div>
          </div>
        `;
        renderedCount++;
      });

      if (renderedCount === 0) {
        container.innerHTML = '<div class="loading-msg" style="color:var(--text-muted)">ไม่มีข้อมูลการผลิตในช่วงวันที่นี้</div>';
      } else {
        container.innerHTML = finalHTML;
      }

    } catch (error) {
      container.innerHTML = `<div class="loading-msg" style="color:var(--stock-red)">เกิดข้อผิดพลาด: ${error.message}</div>`;
    }
  }

// ==========================================
  // EXPORT TO EXCEL (จัดรูปแบบตามภาพตัวอย่าง)
  // ==========================================
  // ==========================================
  // EXPORT TO EXCEL (จัดรูปแบบเป๊ะตามไฟล์ภาพ)
  // ==========================================
  function exportToExcel() {
    let container = document.getElementById("reportContainer").cloneNode(true);
    
    if (container.querySelectorAll('table').length === 0) {
      alert("ไม่มีตารางข้อมูลสำหรับส่งออก"); return;
    }

    // ลบไอคอนทิ้งก่อนส่งออก เพื่อไม่ให้มีสัญลักษณ์แปลกๆ ไปโผล่ใน Excel
    let icons = container.querySelectorAll('i');
    icons.forEach(i => i.remove());

    let htmlContent = container.innerHTML;
    
    // โครงสร้างไฟล์ Excel พร้อมฝัง CSS ตกแต่งสีฟอนต์และเส้นขอบตามรูป
    let excelHtml = `
      <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
      <head>
        <meta charset="utf-8">
        <style>
          /* ฟอนต์มาตรฐาน Excel */
          body { font-family: 'Tahoma', 'Arial', sans-serif; }
          
          /* กำหนดเส้นตารางสีดำชัดเจน */
          table { border-collapse: collapse; margin-bottom: 20px; width: 100%; }
          th, td { border: 1px solid #000000; padding: 4px; font-size: 10pt; text-align: right; }
          
          /* แถวหัวตาราง (วันที่) -> สีเขียว, จัดกึ่งกลาง */
          th { color: #008000; text-align: center; font-weight: normal; }
          
          /* คอลัมน์แรก (รายการ/วันที่) -> จัดชิดซ้าย */
          .sticky-col { text-align: left; }
          
          /* แถวยอดผลิต และ เวลาทำ -> สีดำ */
          tr.row-qty td, tr.row-qty td.sticky-col { color: #000000; }
          tr.row-hrs td, tr.row-hrs td.sticky-col { color: #000000; }
          
          /* แถวต้นทุน/ชิ้น -> สีแดง */
          tr.row-cost td, tr.row-cost td.sticky-col { color: #ff0000; }
          
          /* หัวข้อขั้นตอน (>> ขั้นตอน: ...) -> สีน้ำเงิน ไม่มีกรอบ */
          h3.matrix-title { 
            color: #0000ff; 
            font-size: 11pt; 
            text-align: left; 
            margin: 15px 0 5px 0; 
            font-weight: normal; 
            border: none;
            background: none;
          }
          h3.matrix-title span { color: #0000ff; }
          
          /* หัวกระดาษสุด (ชื่อรายงาน) -> สีดำ ตัวใหญ่ จัดกึ่งกลาง */
          h2.excel-header { 
            text-align: center; 
            font-size: 16pt; 
            font-weight: normal; 
            margin-bottom: 20px; 
            color: #000000; 
          }
        </style>
      </head>
      <body>
        <h2 class="excel-header">สรุปรายงานต้นทุนการผลิต ต่อหน่วยแยกตามขั้นตอนการผลิต โรงงาน BC</h2>
        ${htmlContent}
      </body>
      </html>
    `;

    let blob = new Blob([excelHtml], { type: 'application/vnd.ms-excel' });
    let url = URL.createObjectURL(blob);
    let a = document.createElement('a');
    a.href = url;
    a.download = `Cost_Matrix_${new Date().toISOString().slice(0,10)}.xls`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }
</script>
</body>
</html>
